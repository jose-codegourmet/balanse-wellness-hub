name: Materialize headshot-v2 4K masters
on:
  workflow_dispatch:
  push:
    branches: [assets/headshot-v2-locked-pose-4k]
    paths:
      - docs/assets/headshots/headshot-v2-jobs.json
      - scripts/materialize-headshot-v2.sh
      - .github/workflows/materialize-headshot-v2.yml
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick jq
      - name: Materialize from CDN
        run: bash scripts/materialize-headshot-v2.sh
      - name: Commit masters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/headshots/*/headshot-4x5.jpg docs/assets/headshots/*/headshot-4x5.webp docs/assets/headshots/*/preview.jpg || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "assets(headshots): materialize headshot-v2 locked-pose 4K masters from CDN"
            git push
          fi
