name: Seed MVP roadmap issues

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CREATE to run (normally disabled)'
        required: true

permissions:
  contents: read
  issues: write

jobs:
  seed:
    if: github.event.inputs.confirm == 'CREATE'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create issues from MVP roadmap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/seed-mvp-issues/create.py
