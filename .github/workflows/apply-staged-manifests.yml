name: Apply staged asset manifests
on:
  workflow_dispatch:
  push:
    branches: [assets/coaches-b-approve-upload-gate]
    paths:
      - docs/assets/_staging/**
      - scripts/apply-staged-manifests.sh
      - .github/workflows/apply-staged-manifests.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode staged manifests
        run: bash scripts/apply-staged-manifests.sh
      - name: Commit restored manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/manifest.json packages/domain/src/asset-manifest.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "assets(coaches-b): apply approved ASSET-015 group hero manifests from staging"
            git push
          fi
