name: Apply coaches-b approval patch
on:
  workflow_dispatch:
  push:
    branches: [assets/coaches-b-approve-upload-gate]
    paths:
      - docs/assets/_staging/coaches-b-patch.json
      - scripts/apply-coaches-b-patch.py
      - .github/workflows/apply-coaches-b-patch.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore manifests from main then patch coaches-b
        run: |
          git checkout origin/main -- docs/assets/manifest.json packages/domain/src/asset-manifest.json
          python3 scripts/apply-coaches-b-patch.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/manifest.json packages/domain/src/asset-manifest.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "assets(coaches-b): approve ASSET-015 group hero with 8-coach source binding"
            git push
          fi
