name: Expand marketing pack
on:
  push:
    branches: [assets/cta-marketing-refresh]
    paths: ['docs/assets/marketing/_pack/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode pack
        run: bash docs/assets/marketing/_pack/decode.sh
      - name: Commit binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/marketing
          if git diff --cached --quiet; then
            echo "No binary changes"
            exit 0
          fi
          git commit -m "chore(assets): expand CTA marketing webready binaries"
          git push
